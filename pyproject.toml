[project]
name = "nuformer"
version = "0.1.0"
description = "Replication of nuFormer: Modeling Financial Habits with Transformers (Nubank, arXiv:2507.23267)"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "paragao"},
]
readme = "README.md"

dependencies = [
    "torch>=2.5.0",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "hydra-core>=1.3",
    "tokenizers>=0.19",
    "transformers>=4.44",
    "scikit-learn>=1.5",
    "mlflow>=2.15",
    "boto3>=1.34",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
    "flash-attn>=2.6.3",
    "xformers>=0.0.28",
    "accelerate>=0.33",
    "transformer-engine>=1.13",
]
curator = [
    "nemo-curator>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
